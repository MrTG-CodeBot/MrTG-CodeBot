<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 58" width="230" height="58">
  <defs>
    <linearGradient id="dc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2" />
      <stop offset="100%" stop-color="#7983F5" />
    </linearGradient>

    <linearGradient id="dc-stroke-anim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.2">
        <animate attributeName="offset" values="0;1;0" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#808eff" stop-opacity="1">
        <animate attributeName="offset" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#5865F2" stop-opacity="0.2">
        <animate attributeName="offset" values="1;0;1" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <style>
    @keyframes arrowBounce {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(4px); }
    }
    @keyframes beaconPulseDc {
      0%, 100% { opacity: 0.4; r: 3.5; }
      50% { opacity: 1; r: 4.5; }
    }
    @keyframes cardGlowDc {
      0%, 100% { stroke-opacity: 0.5; }
      50% { stroke-opacity: 1; }
    }
    .card-border {
      fill: #0d1117;
      stroke: url(#dc-stroke-anim);
      stroke-width: 1.5;
      rx: 14;
      animation: cardGlowDc 3s infinite ease-in-out;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 0.3px;
    }
    .text-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #7983F5;
    }
    .arrow {
      fill: #7983F5;
      animation: arrowBounce 1.8s infinite ease-in-out;
    }
    .beacon {
      fill: #5865F2;
      animation: beaconPulseDc 2s infinite ease-in-out;
    }
  </style>

  <!-- Button Background & Border -->
  <rect x="2" y="2" width="226" height="54" class="card-border" />

  <!-- Discord Icon Circle -->
  <g transform="translate(14, 11)">
    <circle cx="18" cy="18" r="17" fill="url(#dc-grad)" />
    <!-- Discord Controller Clyde Icon -->
    <path d="M23.5 13.2c-1.3-.6-2.7-1-4.2-1.2-.2.3-.4.7-.5 1-1.6-.2-3.1-.2-4.6 0-.2-.3-.4-.7-.6-1-1.5.2-2.9.6-4.2 1.2-2.6 3.9-3.3 7.7-3 11.5 1.7 1.3 3.4 2 5.1 2.5.4-.6.8-1.2 1.1-1.8-.6-.2-1.2-.5-1.7-.9.1-.1.3-.2.4-.3 3.3 1.5 6.9 1.5 10.2 0 .1.1.3.2.4.3-.5.4-1.1.7-1.7.9.3.6.7 1.2 1.1 1.8 1.7-.5 3.4-1.2 5.1-2.5.4-4.4-.7-8.2-2.6-11.5zm-8.8 8.8c-.9 0-1.7-.8-1.7-1.8s.8-1.8 1.7-1.8c1 0 1.8.8 1.7 1.8 0 1-.8 1.8-1.7 1.8zm6.6 0c-.9 0-1.7-.8-1.7-1.8s.8-1.8 1.7-1.8c1 0 1.8.8 1.7 1.8 0 1-.7 1.8-1.7 1.8z" fill="#ffffff" />
  </g>

  <!-- Text Info -->
  <text x="60" y="26" class="text-title">Discord</text>
  <text x="60" y="42" class="text-sub">mr_.orion</text>

  <!-- Pulsing Online Indicator -->
  <circle cx="196" cy="22" r="4" class="beacon" />

  <!-- Animated Right Arrow -->
  <g class="arrow" transform="translate(192, 28)">
    <path d="M0 6l5-5-5-5M4 1h-8" stroke="#7983F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
