<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 58" width="230" height="58">
  <defs>
    <linearGradient id="tg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088cc" />
      <stop offset="50%" stop-color="#26A5E4" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="stroke-anim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26A5E4" stop-opacity="0.2">
        <animate attributeName="offset" values="0;1;0" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="1">
        <animate attributeName="offset" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#26A5E4" stop-opacity="0.2">
        <animate attributeName="offset" values="1;0;1" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="tg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes arrowBounce {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(4px); }
    }
    @keyframes beaconPulse {
      0%, 100% { opacity: 0.4; r: 3.5; }
      50% { opacity: 1; r: 4.5; }
    }
    @keyframes cardGlow {
      0%, 100% { stroke-opacity: 0.5; }
      50% { stroke-opacity: 1; }
    }
    .card-border {
      fill: #0d1117;
      stroke: url(#stroke-anim);
      stroke-width: 1.5;
      rx: 14;
      animation: cardGlow 3s infinite ease-in-out;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 0.3px;
    }
    .text-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #26A5E4;
    }
    .arrow {
      fill: #26A5E4;
      animation: arrowBounce 1.8s infinite ease-in-out;
    }
    .beacon {
      fill: #00F2FE;
      animation: beaconPulse 2s infinite ease-in-out;
    }
  </style>

  <!-- Button Background & Border -->
  <rect x="2" y="2" width="226" height="54" class="card-border" />

  <!-- Telegram Icon Circle -->
  <g transform="translate(14, 11)">
    <circle cx="18" cy="18" r="17" fill="url(#tg-grad)" />
    <!-- Paper Plane Icon -->
    <path d="M10.8 17.6l12.4-5.2c.6-.2 1.1.2 1 .8l-2.1 10.1c-.2.7-.6.9-1.2.6l-3.3-2.4-1.6 1.5c-.2.2-.3.3-.7.3l.2-3.4 6.2-5.6c.3-.2-.1-.4-.4-.2l-7.7 4.9-3.3-1c-.7-.2-.7-.7.1-1z" fill="#ffffff" />
  </g>

  <!-- Text Info -->
  <text x="60" y="26" class="text-title">Telegram</text>
  <text x="60" y="42" class="text-sub">@MrTG_Coder</text>

  <!-- Pulsing Online Indicator -->
  <circle cx="196" cy="22" r="4" class="beacon" />

  <!-- Animated Right Arrow -->
  <g class="arrow" transform="translate(192, 28)">
    <path d="M0 6l5-5-5-5M4 1h-8" stroke="#26A5E4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
