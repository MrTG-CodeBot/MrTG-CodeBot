<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230">
  <defs>
    <linearGradient id="neon-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE">
        <animate attributeName="stop-color" values="#00F2FE;#4FACFE;#0088cc;#00F2FE" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#26A5E4">
        <animate attributeName="stop-color" values="#26A5E4;#00F2FE;#4FACFE;#26A5E4" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#4FACFE">
        <animate attributeName="stop-color" values="#4FACFE;#0088cc;#00F2FE;#4FACFE" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Fades for smooth infinite carousel edges -->
    <linearGradient id="edge-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1" />
      <stop offset="6%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="94%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1" />
    </linearGradient>
  </defs>

  <style>
    @keyframes marquee1 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-960px); }
    }
    @keyframes marquee2 {
      0% { transform: translateX(-960px); }
      100% { transform: translateX(0); }
    }
    @keyframes scan {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }
    .track1 {
      animation: marquee1 22s linear infinite;
    }
    .track2 {
      animation: marquee2 24s linear infinite;
    }
    .badge-card {
      fill: url(#badge-bg);
      stroke: #30363d;
      stroke-width: 1.2;
      rx: 10;
    }
    .badge-card:hover {
      stroke: #00F2FE;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e6edf3;
    }
    .header-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #00F2FE;
      text-transform: uppercase;
    }
    .radar-dot {
      fill: #00F2FE;
      animation: scan 2s infinite ease-in-out;
    }
  </style>

  <!-- Outer Container Card with Glowing Animated Border -->
  <rect x="2" y="2" width="796" height="226" rx="16" fill="#0d1117" stroke="url(#neon-stroke)" stroke-width="1.8" />

  <!-- Card Top Banner -->
  <g transform="translate(24, 28)">
    <circle cx="0" cy="-4" r="4.5" class="radar-dot" />
    <text x="14" y="0" class="header-title">⚡ Interactive Tech Matrix &amp; Stack</text>
  </g>

  <!-- Row 1: Languages & Bot Tech (Moving Left) -->
  <g transform="translate(0, 52)">
    <g class="track1">
      <!-- SET A -->
      <g transform="translate(10, 0)">
        <rect width="120" height="42" class="badge-card" />
        <circle cx="22" cy="21" r="9" fill="#3776AB" />
        <text x="22" y="25" font-size="10" font-weight="900" fill="#fff" text-anchor="middle">PY</text>
        <text x="40" y="26" class="badge-text">Python</text>
      </g>
      <g transform="translate(140, 0)">
        <rect width="165" height="42" class="badge-card" />
